# Application
spring.application.name=ai-health-assistant
server.port=8080

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/aihealth
spring.data.mongodb.database=aihealth

# JWT
app.jwt.secret=your-super-secret-jwt-key-change-this-in-production
app.jwt.expiration=86400000

# OpenAI
app.openai.api-key=${OPENAI_API_KEY:your-openai-api-key-here}
app.openai.model=gpt-4o

# FHIR Server
app.fhir.server-url=http://hapi.fhir.org/baseR4

# LangChain4j
langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY}
langchain4j.open-ai.chat-model.model-name=gpt-4o
langchain4j.open-ai.chat-model.temperature=0.3

# CORS
app.cors.allowed-origins=http://localhost:3000

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Logging
logging.level.com.aihealth=DEBUG
