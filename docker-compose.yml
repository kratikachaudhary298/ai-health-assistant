version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: aihealth-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: aihealth
    volumes:
      - mongodb_data:/data/db
    networks:
      - aihealth-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aihealth-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/aihealth
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - mongodb
    networks:
      - aihealth-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aihealth-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8080
    depends_on:
      - backend
    networks:
      - aihealth-network

volumes:
  mongodb_data:

networks:
  aihealth-network:
    driver: bridge
